[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bot"
version = "0.1.0"
description = "Binance USDT-M mean-reversion bot, staged implementation"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings>=2.7,<3", "pyyaml>=6.0.2,<7",
  "pandas>=2.2,<3", "loguru>=0.7,<1", "ccxt>=4.4,<5", "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]
